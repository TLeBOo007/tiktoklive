<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ศึกมวยไลฟ์</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#05070d;color:#fff;font-family:Sarabun,'Noto Sans Thai',Tahoma,sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:10px}
canvas{display:block;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.6);margin:0 auto}
.warm{position:absolute;left:-999px;top:0;opacity:0}
.warm span:first-child{font-family:Kanit;font-weight:800}.warm span:last-child{font-family:Sarabun;font-weight:700}
.panel{margin-top:10px;background:linear-gradient(#141a2e,#0b0f1c);border:1px solid #2a3558;border-radius:14px;padding:12px}
.panel h3{margin:0 0 8px;font:600 14px Kanit,sans-serif;color:#ffd36b}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
input[type=text]{flex:1;min-width:0;background:#070a14;border:1px solid #2a3558;color:#fff;border-radius:10px;padding:9px;font:inherit}
button{background:linear-gradient(#d22030,#8e0f1c);color:#fff;border:1px solid rgba(255,211,107,.4);border-radius:10px;padding:9px 11px;font:700 14px Sarabun,sans-serif;cursor:pointer}
button:active{transform:scale(.96)}
button.alt{background:#1c2440}button.blue{background:linear-gradient(#2a6be0,#173f8e)}button.gold{background:linear-gradient(#c9952a,#8a6410)}
label{font-size:13px;display:flex;align-items:center;gap:6px;margin-top:4px}
.note{font-size:12px;color:#9aa6c9;line-height:1.5;margin:6px 0 0}
body.live{overflow:hidden;background:#000}
body.live .wrap{max-width:none;padding:0;height:100vh;display:flex;align-items:center;justify-content:center}
body.live canvas{border-radius:0;box-shadow:none}
body.live .panel{display:none}
</style>
</head>
<body>

<div class="wrap">
<canvas id="c"></canvas>
<div class="panel">
<h3>ทดลองเป็นคนดู (ตอนไลฟ์จริงจะมาจาก TikTok)</h3>
<div class="row"><input type="text" id="nm" placeholder="ชื่อคนดู (เว้นว่าง = สุ่ม)" maxlength="16"><button id="bFollow" class="alt">＋ เข้ามา</button></div>

<script>
const LIVE=new URLSearchParams(location.search).get('live')==='1';
const QS=new URLSearchParams(location.search);
if(LIVE)document.body.classList.add('live');
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=640;let K=1;
function resize(){
  const DPR=Math.min(3,window.devicePixelRatio||1);let cw,ch;
  if(LIVE){ch=window.innerHeight;cw=ch*W/H;if(cw>window.innerWidth){cw=window.innerWidth;ch=cw*H/W}}
  else{cw=Math.min(420,cv.parentElement.clientWidth);ch=cw*H/W}
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);K=cv.width/W;
}
window.addEventListener('resize',resize);resize();
if(document.fonts)['800 20px Kanit','700 20px Kanit','400 14px Sarabun','700 14px Sarabun'].forEach(f=>document.fonts.load(f).catch(()=>{}));

/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{const c=1.7;t=clamp(t,0,1);return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const TH="'Noto Sans Thai',Tahoma,sans-serif";
const F=(w,s,fam)=>w+' '+s+'px '+(fam||'Sarabun')+','+TH;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function poly(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}}
function txt(s,x,y,font,col,align,stroke,sw){ctx.font=font;ctx.textAlign=align||'left';if(stroke){ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=sw||3;ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function fit(s,maxW,font){ctx.font=font;s=String(s);if(ctx.measureText(s).width<=maxW)return s;let t=s;while(t.length>1&&ctx.measureText(t+'…').width>maxW)t=t.slice(0,-1);return t+'…'}
function radial(x,y,r0,r1,c0,c1){const g=ctx.createRadialGradient(x,y,r0,x,y,r1);g.addColorStop(0,c0);g.addColorStop(1,c1);return g}
function glowAt(x,y,r,rgb,a){ctx.fillStyle=radial(x,y,0,r,'rgba('+rgb+','+a+')','rgba('+rgb+',0)');ctx.fillRect(x-r,y-r,r*2,r*2)}
function seg(x1,y1,x2,y2,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function ik(ax,ay,bx,by,l1,l2,bend){let dx=bx-ax,dy=by-ay,d=Math.max(.01,Math.min(Math.hypot(dx,dy),l1+l2-.01));
  const a=Math.atan2(dy,dx),c=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1)),g=a+bend*c;return{x:ax+Math.cos(g)*l1,y:ay+Math.sin(g)*l1}}

/* ---------- data ---------- */
const NAMES=['น้องมายด์','พี่เอ็ม','ป้าแดง','Tawannn','ไอ้ย้อย','Khakty','ลุงหมี','แพรว','nutnicha','โอ๊ต','ส้มโอ','mon_cm','เจ๊น้อย','ต้นกล้า','ฟ้าใส','อาปุ๊','ครูแอน','เอิร์ธ','มะปราง','พี่บอม','ป้าหน่อย','นุ่น','โต้ง','ปอนด์'];
const SHIRTS=['#3a3f55','#4a3a2a','#2f4a3a','#55304a','#2a4055','#5a4a2a','#333','#46345a'];
const SKINS=['#f6d3b0','#ebbd94','#d9a273','#c98e60','#f3c9a3'];
const HAIRS=['#161616','#3a2418','#5a3a22','#1d2340'];
const MOVES={jab:{e:'👊',n:'หมัด',c:1,dur:.32},kick:{e:'🦵',n:'เตะ',c:5,dur:.55},elbow:{e:'💥',n:'ศอก',c:20,dur:.42},knee:{e:'🔥',n:'เข่าลอย',c:100,dur:.7}};
const MOVE_ALIAS={incense:'jab',stick:'kick',lantern:'elbow',bless:'knee'};
const RED='#d8202f',BLUE='#2463d8';
const HITWORDS=['ปั้ก!','ตึ้ง!','โป๊ก!','พลั่ก!','ปึ้ก!'];
const SLOTS=[];
[[528,[36,92,148,212,268,324]],[562,[64,120,180,240,296]],[596,[36,92,148,212,268,324]],[628,[90,180,270]]]
 .forEach(([y,xs])=>xs.forEach(x=>SLOTS.push({x,y,s:.78+(y-528)/100*.2})));
const ROUND_T=LIVE?45:25,ROUNDS=3,BREAK_T=4;

const S={t:0,avs:[],feed:[],toasts:[],parts:[],score:{},names:{},team:{},queue:[],lastSay:{},
  autoT:1.5,shake:0,flash:0,slow:0,npcT:0,msg:null,msgQ:[],cheerLevel:0,
  F:{state:'empty',t:0,red:null,blue:null,round:1,time:ROUND_T,blowT:1.2,defenses:0}};

/* ---------- profile pictures ---------- */
const IMG={};
function getImg(url){if(!url)return null;let o=IMG[url];
  if(!o){o=IMG[url]={img:new Image(),ok:false};o.img.referrerPolicy='no-referrer';o.img.onload=()=>o.ok=true;o.img.src=url}return o.ok?o.img:null}
function drawHead(w,x,y,r,ring,lw){
  const img=getImg(w.pic);ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();
  if(img)ctx.drawImage(img,x-r,y-r,r*2,r*2);
  else{ctx.fillStyle=w.skin||'#ebbd94';ctx.fillRect(x-r,y-r,r*2,r*2);ctx.fillStyle=w.hair||'#161616';ctx.beginPath();ctx.ellipse(x,y-r*.5,r*1.1,r*.7,0,0,7);ctx.fill();
    ctx.fillStyle='#2a1a14';ctx.beginPath();ctx.arc(x-r*.36,y+r*.12,r*.12,0,7);ctx.arc(x+r*.36,y+r*.12,r*.12,0,7);ctx.fill()}
  ctx.restore();ctx.strokeStyle=ring||'rgba(255,255,255,.85)';ctx.lineWidth=lw||1.6;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
}

/* ---------- TTS (เสียงพากย์) ---------- */
const TTS={on:LIVE?QS.get('tts')!=='0':false,q:[],busy:false,voice:null,hasTh:false,unlocked:!LIVE};
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>/^th/i.test(v.lang));
  TTS.hasTh=vs.length>0;TTS.voice=vs.find(v=>/niwat/i.test(v.name))||vs.find(v=>/natural|online/i.test(v.name))||vs[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function spk(n){n=String(n||'').replace(/[^฀-๿a-zA-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim().slice(0,20);return n||'ผู้ชม'}
function say(text,prio){
  if(!TTS.on||!('speechSynthesis' in window)||!TTS.hasTh)return;
  if(TTS.q.length>=3){if((prio||0)<2)return;TTS.q=TTS.q.filter(x=>x.p>=2).slice(-2)}
  TTS.q.push({text,p:prio||0});pumpSay();
}
function pumpSay(){
  if(TTS.busy||!TTS.q.length||!TTS.unlocked)return;
  let bi=0;TTS.q.forEach((x,i)=>{if(x.p>TTS.q[bi].p)bi=i});const it=TTS.q.splice(bi,1)[0];
  const u=new SpeechSynthesisUtterance(it.text);u.lang='th-TH';if(TTS.voice)u.voice=TTS.voice;u.rate=1.15;u.pitch=1.05;
  TTS.busy=true;duck(true);const done=()=>{if(!TTS.busy)return;TTS.busy=false;if(!TTS.q.length)duck(false);setTimeout(pumpSay,150)};u.onend=done;u.onerror=done;
  try{speechSynthesis.speak(u)}catch(_){done()}setTimeout(()=>{if(TTS.busy&&!speechSynthesis.speaking)done()},15000);
}
function unlockAudio(){startAudio();if(AUD.c&&AUD.c.state==='suspended')AUD.c.resume();if(TTS.unlocked)return;TTS.unlocked=true;pickVoice();say('เปิดเสียงแล้ว',3)}

/* ---------- เพลงปี่กลองมวย + เสียงประกอบ (สร้างสดด้วย Web Audio ไม่ใช้ไฟล์เพลง) ---------- */
const AUD={music:LIVE?QS.get('music')!=='0':false,sfx:LIVE?QS.get('sfx')!=='0':false,c:null,mg:null,sg:null,last:{},started:false,ducked:false,step:0,next:0,pi:null,piG:null,piIdx:7};
const PENTA=[0,2,4,7,9];
function noteFreq(i){const oct=Math.floor(i/5),deg=((i%5)+5)%5;return 146.83*Math.pow(2,oct+PENTA[deg]/12)}
function musicLevel(){return AUD.music?(AUD.ducked?.16:.5):0}
function startAudio(){
  if(AUD.started||(!AUD.music&&!AUD.sfx))return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC()}catch(_){return}AUD.c=c;AUD.started=true;if(c.resume)c.resume();
  const master=c.createGain();master.gain.value=.9;const comp=c.createDynamicsCompressor();master.connect(comp);comp.connect(c.destination);
  const len=Math.floor(c.sampleRate*1.6),buf=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  const rv=c.createConvolver();rv.buffer=buf;const rvg=c.createGain();rvg.gain.value=.22;rv.connect(rvg);rvg.connect(master);
  AUD.mg=c.createGain();AUD.mg.gain.value=musicLevel();AUD.mg.connect(master);AUD.mg.connect(rv);
  AUD.sg=c.createGain();AUD.sg.gain.value=AUD.sfx?.75:0;AUD.sg.connect(master);AUD.sg.connect(rv);
  // ปี่: เสียงลิ้นแหลม (sawtooth ผ่านฟิลเตอร์) มีลูกคอ
  const o=c.createOscillator();o.type='sawtooth';o.frequency.value=noteFreq(7);
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1300;bp.Q.value=1.3;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3800;
  const g=c.createGain();g.gain.value=0;const vib=c.createOscillator();vib.frequency.value=5.6;const vg=c.createGain();vg.gain.value=7;vib.connect(vg);vg.connect(o.frequency);
  o.connect(bp);bp.connect(lp);lp.connect(g);g.connect(AUD.mg);o.start();vib.start();AUD.pi=o;AUD.piG=g;
  AUD.next=c.currentTime+.3;setInterval(schedMusic,100);
}
function setAudioLevels(){if(!AUD.c)return;const t=AUD.c.currentTime;AUD.mg.gain.setTargetAtTime(musicLevel(),t,.2);AUD.sg.gain.setTargetAtTime(AUD.sfx?.75:0,t,.1)}
function duck(on){AUD.ducked=on;setAudioLevels()}
function tone(dest,f0,f1,t,dur,vol,type){const c=AUD.c,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur*.8);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02)}
function noiseAt(dest,t,dur,vol,type,f,q,attack){const c=AUD.c,len=Math.ceil(c.sampleRate*dur),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();
  if(attack){g.gain.setValueAtTime(.0005,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0005,t+dur)}else{g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur)}
  s.connect(fl);fl.connect(g);g.connect(dest);s.start(t);return fl}
function bell(dest,f,t,vol,dec){const c=AUD.c;[[1,1],[2.76,.4],[5.4,.2]].forEach(([m,a])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f*m;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*a,t+.004);g.gain.exponentialRampToValueAtTime(.0004,t+dec/Math.pow(m,.3));o.connect(g);g.connect(dest);o.start(t);o.stop(t+dec+.1)})}
function schedMusic(){
  const c=AUD.c;if(!c||!AUD.music)return;const fight=S.F.state==='fight';const bpm=fight?150:104,sd=60/bpm/2;
  while(AUD.next<c.currentTime+.35){
    const t=AUD.next,s=AUD.step%16,d=AUD.mg;
    if([0,3,6,8,11,14].includes(s)){tone(d,120,52,t,.28,.45);noiseAt(d,t,.05,.18,'lowpass',400,.7)}   // กลองแขก เสียงทุ้ม
    if([2,5,10,13].includes(s)){tone(d,360,320,t,.12,.18);noiseAt(d,t,.03,.12,'bandpass',2400,2)}       // เสียงแหลม
    if(s===0||s===8)bell(d,2650,t,.045,.7);                                                                   // ฉิ่ง
    if(s===4||s===12)noiseAt(d,t,.05,.1,'bandpass',4200,3);                                                   // ฉับ
    // ทำนองปี่
    if(Math.random()<.72){AUD.piIdx=clamp(AUD.piIdx+pick([-2,-1,-1,1,1,2,0]),5,15);
      const f=noteFreq(AUD.piIdx);AUD.pi.frequency.setTargetAtTime(f,t,.018);AUD.piG.gain.setTargetAtTime(fight?.075:.055,t,.012);
      if(Math.random()<.18){AUD.pi.frequency.setTargetAtTime(noteFreq(AUD.piIdx+1),t+sd*.33,.01);AUD.pi.frequency.setTargetAtTime(f,t+sd*.66,.01)}
      AUD.piG.gain.setTargetAtTime(fight?.05:.035,t+sd*.75,.03)}
    else AUD.piG.gain.setTargetAtTime(.004,t,.04);
    AUD.step++;AUD.next+=sd;
  }
}
function sfx(name){
  const c=AUD.c;if(!c||!AUD.sfx)return;const now=c.currentTime,lim={join:.4,punch:.06,cheer:1.2}[name]||.05;
  if(AUD.last[name]&&now-AUD.last[name]<lim)return;AUD.last[name]=now;const d=AUD.sg,t=now+.01;
  if(name==='join'){noiseAt(d,t,.05,.2,'bandpass',1000,6)}
  else if(name==='bell'){bell(d,1480,t,.14,1.8);bell(d,1480,t+.38,.14,2)}
  else if(name==='punch'){tone(d,170,48,t,.16,.5);noiseAt(d,t,.08,.35,'lowpass',900,.8)}
  else if(name==='kick'){const f=noiseAt(d,t,.2,.18,'bandpass',500,1.5);f.frequency.exponentialRampToValueAtTime(2200,t+.18);tone(d,140,40,t+.18,.22,.6);noiseAt(d,t+.18,.12,.4,'lowpass',1400,.8)}
  else if(name==='big'){tone(d,110,32,t,.5,.75);noiseAt(d,t,.3,.5,'lowpass',700,.7);noiseAt(d,t,.12,.3,'highpass',2500,.7)}
  else if(name==='cheer'){noiseAt(d,t,2.2,.26,'bandpass',900,.5,.4);noiseAt(d,t,2,.12,'bandpass',2200,.8,.5);for(let i=0;i<5;i++)tone(d,rnd(380,520),rnd(650,900),t+rnd(0,.6),.6,.025,'triangle')}
  else if(name==='crown'){for(let i=0;i<12;i++)bell(d,noteFreq(8+i),t+i*.05,.045,1.6)}
  else if(name==='ko'){tone(d,90,30,t,1.2,.8);noiseAt(d,t,.6,.5,'lowpass',500,.7);bell(d,1480,t+.2,.12,2);bell(d,1480,t+.55,.12,2);bell(d,1480,t+.9,.12,2.2)}
}

/* ---------- crowd ---------- */
function add(w,v){S.score[w.id]=(S.score[w.id]||0)+v;S.names[w.id]=w.name}
function topIds(){return Object.entries(S.score).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0])}
function addFeed(text){S.feed.push({text,t:0});if(S.feed.length>3)S.feed.shift()}
function toast(a,mv,side){S.toasts.push({a,m:MOVES[mv],side,t:0});if(S.toasts.length>3)S.toasts.shift()}
function burst(x,y,n,col,sp){for(let i=0;i<n;i++)S.parts.push({k:'spark',x,y,vx:rnd(-1,1)*(sp||70),vy:rnd(-110,-10),life:0,max:rnd(.5,1),col})}
function realCount(){return S.avs.filter(v=>!v.npc).length}
function isFighter(id){const f=S.F;return (f.red&&f.red.w.id===id)||(f.blue&&f.blue.w.id===id)}
function freeSlot(){
  const used=new Set(S.avs.map(v=>v.slot));let slot=SLOTS.findIndex((_,i)=>!used.has(i));
  if(slot<0){const ni=S.avs.findIndex(v=>v.npc);if(ni>=0){slot=S.avs[ni].slot;S.avs.splice(ni,1)}}
  if(slot<0){const keep=new Set(topIds());let idx=S.avs.findIndex(v=>!keep.has(v.id));if(idx<0)idx=0;slot=S.avs[idx].slot;S.avs.splice(idx,1)}
  return slot;
}
function addNpc(){const used=new Set(S.avs.map(v=>v.slot));const free=SLOTS.map((_,i)=>i).filter(i=>!used.has(i));if(!free.length)return;
  S.avs.push({id:'npc_'+Math.random(),name:'',npc:true,slot:pick(free),shirt:pick(SHIRTS),skin:pick(SKINS),hair:pick(HAIRS),spawn:0,cheer:0,hop:0,say:'',sayT:0})}
function ensure(w){
  let a=S.avs.find(v=>v.id===w.id);if(a){a.name=w.name||a.name;if(w.pic)a.pic=w.pic;return a}
  a={id:w.id,name:w.name,pic:w.pic||'',slot:freeSlot(),shirt:pick(SHIRTS),skin:pick(SKINS),hair:pick(HAIRS),spawn:0,cheer:0,hop:0,say:'',sayT:0};
  S.avs.push(a);const p=SLOTS[a.slot];burst(p.x,p.y-30,12,'#ffd36b');return a;
}
function crowdCheer(level){S.avs.forEach(v=>{if(Math.random()<level)v.cheer=Math.max(v.cheer,rnd(1,2.2))})}

/* ---------- fighters & fight logic ---------- */
function newFighter(w,color,facing){return{w:{id:w.id,name:w.name,pic:w.pic||''},color,facing,hp:100,pose:'idle',pt:0,q:[],hitT:0,x:facing>0?138:222,ph:rnd(0,6),impact:null,skin:pick(SKINS)}}
function startMove(f,mv,dmg,from){f.pose=mv;f.pt=0;f.impact={dmg,mv,at:MOVES[mv].dur*.5,from}}
function queueMove(f,mv,dmg,from){if(f.pose==='idle'||f.pose==='hit')startMove(f,mv,dmg,from);else if(f.q.length<6)f.q.push([mv,dmg,from])}
function dmgFor(coins){return Math.round(6*Math.sqrt(coins)*rnd(.9,1.1))}
function moveFor(coins){return coins>=100?'knee':coins>=20?'elbow':coins>=5?'kick':'jab'}
function other(f){const F=S.F;return f===F.red?F.blue:F.red}
function crown(w,silent){
  const F=S.F;F.red=newFighter(w,RED,1);F.red.x=180;F.blue=null;F.defenses=0;F.state='crown';F.t=0;
  S.queue=S.queue.filter(q=>q.w.id!==w.id);
  if(!silent){showMsg('👑 แชมป์เวทีคนใหม่!',w.name,'gold',3.2);sfx('crown');sfx('cheer');crowdCheer(.9);say(spk(w.name)+' ขึ้นเป็นแชมป์เวที',3);addFeed('👑 '+w.name+' เป็นแชมป์เวที')}
  reportChamp();
}
function addToQueue(w,coins){
  if(isFighter(w.id))return;let q=S.queue.find(x=>x.w.id===w.id);
  if(!q){q={w:{id:w.id,name:w.name,pic:w.pic||''},coins:0};S.queue.push(q);addFeed('🥊 '+w.name+' เข้าคิวท้าชิง');say(spk(w.name)+' เข้าคิวท้าชิง',0)}
  q.coins+=coins;S.queue.sort((a,b)=>b.coins-a.coins);
}
function startFight(){
  const F=S.F,q=S.queue.shift();if(!q)return;
  F.blue=newFighter(q.w,BLUE,-1);F.blue.x=360;F.red.x=138;F.red.hp=100;F.red.pose='idle';F.red.q=[];
  F.state='intro';F.t=0;F.round=1;F.time=ROUND_T;
  addFeed('🔔 '+F.red.w.name+' ปะทะ '+q.w.name);
  say('มุมแดง แชมป์ '+spk(F.red.w.name)+' มุมน้ำเงิน ผู้ท้าชิง '+spk(q.w.name),3);
}
function endFight(winner,how){
  const F=S.F,loser=other(winner);F.state='ko';F.t=0;F.winner=winner;F.how=how;
  winner.pose='win';winner.pt=0;winner.q=[];
  if(how==='ko'){loser.pose='ko';loser.pt=0;S.slow=1.1;S.shake=.8;S.flash=.5;sfx('ko');sfx('cheer');crowdCheer(1);
    showMsg('K.O.!',winner.w.name+' ชนะน็อก!','ko',3.8);say('น็อคเอาท์ '+spk(winner.w.name)+' ชนะ',3)}
  else{loser.pose='idle';sfx('bell');sfx('cheer');crowdCheer(.7);showMsg('ชนะคะแนน',winner.w.name,'gold',3.5);say('หมดเวลา '+spk(winner.w.name)+' ชนะคะแนน',3)}
  addFeed((how==='ko'?'💥 ':'🏅 ')+winner.w.name+(how==='ko'?' ชนะน็อก ':' ชนะคะแนน ')+loser.w.name);
}
function afterFight(){
  const F=S.F,w=F.winner;
  if(w===F.blue){F.red=w;w.color=RED;w.facing=1;F.defenses=0;F.blue=null;F.state='crown';F.t=0;w.hp=100;w.pose='idle';
    showMsg('👑 แชมป์ใหม่!',w.w.name,'gold',3.2);sfx('crown');say('แชมป์ใหม่ '+spk(w.w.name),3);addFeed('👑 '+w.w.name+' เป็นแชมป์ใหม่')}
  else{F.defenses++;F.blue=null;F.state='idle';F.t=0;w.hp=100;w.pose='idle';addFeed('🛡 '+w.w.name+' ป้องกันแชมป์ครั้งที่ '+F.defenses)}
  reportChamp();
}
let WS=null;
function reportChamp(){const r=S.F.red;if(WS&&WS.readyState===1)try{WS.send(JSON.stringify({type:'champ',who:r?r.w:null,defenses:S.F.defenses}))}catch(_){}}
function applyImpact(att){
  const F=S.F,def=other(att),im=att.impact;att.impact=null;if(!def||F.state!=='fight')return;
  def.hp=Math.max(0,def.hp-im.dmg);def.hitT=.3;if(def.pose!=='knee'&&def.pose!=='kick'){def.pose='hit';def.pt=0}
  const hx=def.x-def.facing*4,hy=im.mv==='kick'?395:im.mv==='knee'?378:356;
  const big=im.dmg>=20;burst(hx,hy,big?26:10,big?'#ffd36b':'#fff',big?150:80);
  S.parts.push({k:'word',x:hx+rnd(-10,10),y:hy-14,vx:0,vy:-30,life:0,max:.9,text:big?(im.mv==='knee'?'เข่าลอย!!':'ศอกกลับ!!'):pick(HITWORDS),big,col:big?'#ffd36b':'#fff'});
  S.parts.push({k:'num',x:hx+def.facing*-14,y:hy+6,vx:0,vy:-26,life:0,max:1,text:'-'+im.dmg,col:'#ff6b6b'});
  if(im.mv==='jab')sfx('punch');else if(im.mv==='kick')sfx('kick');else sfx('big');
  if(big){S.shake=Math.max(S.shake,.45);crowdCheer(.6);sfx('cheer')}else if(im.dmg>=10)crowdCheer(.25);
  if(def.hp<=0)endFight(att,'ko');
}
function fighterGift(w,coins){
  const F=S.F,mv=moveFor(coins),dmg=dmgFor(coins);
  if(!F.red){crown(w);return}
  if(F.state==='fight'){
    let f=null,side=null,from=null;
    if(F.red.w.id===w.id)f=F.red;else if(F.blue&&F.blue.w.id===w.id)f=F.blue;
    else{side=S.team[w.id]||'blue';f=side==='red'?F.red:F.blue;from=w.name;addToQueue(w,coins)}
    queueMove(f,mv,dmg,from);
    if(coins>=20)say(spk(f.w.name)+' '+MOVES[mv].n+(from?' จากแรงเชียร์ของ '+spk(from):'')+'!',1);
    toast({name:w.name,pic:w.pic},mv,side);
  }else{
    if(F.red.w.id===w.id){queueMove(F.red,mv,0,null);toast({name:w.name,pic:w.pic},mv,'red')}
    else{addToQueue(w,coins);toast({name:w.name,pic:w.pic},mv,null)}
  }
}
function updateFighter(f,dt){
  f.pt+=dt;f.hitT=Math.max(0,f.hitT-dt);
  if(f.impact&&f.pt>=f.impact.at){if(S.F.state==='fight')applyImpact(f);else f.impact=null}
  const dur=MOVES[f.pose]?MOVES[f.pose].dur:f.pose==='hit'?.35:0;
  if(dur&&f.pt>=dur){f.pose='idle';f.pt=0;if(f.q.length){const [m,d,fr]=f.q.shift();startMove(f,m,d,fr)}}
}
function updateFight(dt){
  const F=S.F;F.t+=dt;
  if(F.red)updateFighter(F.red,dt);if(F.blue)updateFighter(F.blue,dt);
  if(F.state==='crown'&&F.t>3.2){F.state='idle';F.t=0}
  if(F.state==='idle'){if(F.red){F.red.x=lerp(F.red.x,180,dt*3);
      if(F.red.pose==='idle'&&Math.random()<dt*.6)startMove(F.red,Math.random()<.8?'jab':'kick',0,null)}
    if(S.queue.length&&F.t>2.5)startFight()}
  else if(F.state==='intro'){F.blue.x=lerp(F.blue.x,222,dt*2.5);F.red.x=lerp(F.red.x,138,dt*3);
    if(F.t>3.4){F.state='fight';F.t=0;F.blowT=1;sfx('bell');showMsg('ยกที่ 1','ไฟท์!','fight',1.6);say('ยกที่หนึ่ง ไฟท์',2)}}
  else if(F.state==='fight'){F.time-=dt;F.blowT-=dt;
    if(F.blowT<=0){F.blowT=rnd(.9,1.7);const att=Math.random()<.5?F.red:F.blue;if(att.pose==='idle'){const k=Math.random()<.22;startMove(att,k?'kick':'jab',k?Math.round(rnd(2,4)):Math.round(rnd(1,3)),null)}}
    if(F.time<=0){if(F.round>=ROUNDS){const w=F.red.hp>=F.blue.hp?F.red:F.blue;endFight(w,'points')}
      else{F.state='break';F.t=0;sfx('bell');showMsg('หมดยกที่ '+F.round,'พักยก','fight',2)}}}
  else if(F.state==='break'){if(F.t>BREAK_T){F.round++;F.time=ROUND_T;F.state='fight';F.t=0;sfx('bell');showMsg('ยกที่ '+F.round,'ไฟท์!','fight',1.6);say('ยกที่ '+(F.round===2?'สอง':'สาม'),2)}}
  else if(F.state==='ko'){if(F.t>4.2)afterFight()}
}

/* ---------- events ---------- */
function evJoin(w,follow){
  const fresh=!S.avs.find(v=>v.id===w.id);const a=ensure(w);a.hop=1;
  if(follow){addFeed('➕ '+w.name+' กดติดตาม');say('ขอบคุณ'+spk(w.name)+'ที่กดติดตาม',1);sfx('join')}
  else if(fresh){addFeed('👋 '+w.name+' เข้ามาดูมวย');sfx('join')}
}
function evGift(w,coins){
  const a=ensure(w);a.cheer=2;add(w,coins);fighterGift(w,coins);
}
function evComment(w,text){
  const a=ensure(w);a.say=text;a.sayT=5;
  if(/แดง/.test(text)){S.team[w.id]='red';a.team='red';a.cheer=2;addFeed('🔴 '+w.name+' เชียร์มุมแดง')}
  else if(/น้ำเงิน|ฟ้า/.test(text)){S.team[w.id]='blue';a.team='blue';a.cheer=2;addFeed('🔵 '+w.name+' เชียร์มุมน้ำเงิน')}
  else if(/สู้|เอา|ชนะ|ฮึบ|ไป/.test(text))a.cheer=1.5;
}
function evLike(n,w){for(let i=0;i<Math.min(5,n||1);i++)S.parts.push({k:'heart',x:rnd(250,350),y:rnd(560,620),vx:rnd(-12,12),vy:rnd(-70,-45),life:0,max:rnd(1.8,2.6),col:pick(['#ff4d7a','#ff86a8','#ffd36b'])});if(w)evJoin(w)}
function onServerMsg(m){
  if(!m||m.type==='viewers')return;
  if(m.type==='snapshot'){
    (m.scores||[]).forEach(s=>{S.score[s.who.id]=s.score;S.names[s.who.id]=s.who.name});
    (m.users||[]).forEach(w=>{if(!S.avs.find(v=>v.id===w.id))ensure(w)});
    if(m.champ&&m.champ.who&&!S.F.red){crown(m.champ.who,true);S.F.defenses=m.champ.defenses||0;S.F.state='idle'}return}
  if(m.type==='like'){evLike(m.count,m.who);return}
  if(!m.who)return;
  const type=MOVE_ALIAS[m.type]||m.type;
  if(type==='follow')evJoin(m.who,true);
  else if(type==='join')evJoin(m.who,false);
  else if(MOVES[type])evGift(m.who,m.coins||MOVES[type].c);
  else if(type==='comment')evComment(m.who,String(m.text||''));
}
function showMsg(a,b,kind,dur){const m={a,b,kind,t:0,dur};if(S.msg&&S.msg.t<S.msg.dur*.6&&S.msgQ.length<3)S.msgQ.push(m);else S.msg=m}

/* ---------- update ---------- */
function update(dtRaw){
  const dt=S.slow>0?dtRaw*.35:dtRaw;S.slow=Math.max(0,S.slow-dtRaw);
  S.t+=dt;updateFight(dt);
  S.avs.forEach(a=>{a.spawn=Math.min(1,a.spawn+dt*2.2);['cheer','sayT','hop'].forEach(k=>{if(a[k]>0)a[k]=Math.max(0,a[k]-dt)});
    if(a.npc&&Math.random()<dt*.05)a.cheer=rnd(.8,1.6)});
  S.npcT-=dt;if(S.npcT<=0){S.npcT=2;const rc=realCount(),npcs=S.avs.filter(v=>v.npc);
    if(rc+npcs.length<9&&npcs.length<7)addNpc();else if(rc>=9&&npcs.length)S.avs.splice(S.avs.indexOf(npcs[0]),1)}
  S.shake=Math.max(0,S.shake-dtRaw);S.flash=Math.max(0,S.flash-dtRaw*1.5);
  for(const p of S.parts){p.life+=dt;p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.k==='spark'||p.k==='conf')p.vy+=170*dt}
  S.parts=S.parts.filter(p=>p.life<p.max&&p.y<700);if(S.parts.length>600)S.parts.splice(0,S.parts.length-600);
  S.feed.forEach(f=>f.t+=dt);S.toasts.forEach(t=>t.t+=dt);S.toasts=S.toasts.filter(t=>t.t<3.4);
  if(S.msg){S.msg.t+=dtRaw;if(S.msg.t>S.msg.dur){S.msg=S.msgQ.shift()||null;if(S.msg)S.msg.t=0}}
  if(S.F.state==='ko'&&S.F.how==='ko'&&Math.random()<.5)S.parts.push({k:'conf',x:rnd(0,W),y:rnd(200,260),vx:rnd(-30,30),vy:rnd(-40,20),life:0,max:3,col:pick(['#ffd36b','#ff4d4d','#4d8bff','#fff']),r:rnd(0,6)});
  if(!LIVE&&document.getElementById('auto').checked){S.autoT-=dtRaw;if(S.autoT<=0){S.autoT=rnd(1,2.4);autoEvent()}}
}
const fakeW=n=>({id:'demo_'+n,name:n});
function autoEvent(){
  const w=fakeW(pick(NAMES)),r=Math.random(),F=S.F;
  if(r<.25)evJoin(w);
  else if(r<.4)evComment(w,pick(['แดง','น้ำเงิน','สู้ๆ','แดงงง','น้ำเงินสู้!']));
  else if(r<.48&&F.state==='fight')evGift(Math.random()<.5?F.red.w:F.blue.w,pick([1,1,5,5,20]));
  else if(r<.9)evGift(w,pick([1,1,1,1,5,5,20,100]));
  else evLike(4);
}

function drawArena(){

function fighterPose(f){
  const mv=f.pose,dur=MOVES[mv]?MOVES[mv].dur:.35,p=clamp(f.pt/dur,0,1),e=Math.sin(p*Math.PI);
  let lean=0,fx=0,hop=Math.abs(Math.sin(S.t*5.5+f.ph))*3,ff={x:15,y:0},rf={x:-15,y:0},fg={x:15,y:-7},rg={x:9,y:-3},el=null,kneeP=null;
  if(mv==='jab'){fx=6*e;fg={x:15+25*e,y:-7+3*e};lean=4*e}
  else if(mv==='kick'){rf={x:-15+62*e,y:-44*e};lean=-11*e;rg={x:9-14*e,y:-3+18*e};hop=0}
  else if(mv==='elbow'){fx=9*e;lean=6*e;el={e:{x:lerp(-3,26,e),y:lerp(15,-3,e)},g:{x:lerp(9,14,e),y:lerp(-3,-12,e)}}}
  else if(mv==='knee'){hop=16*e;fx=14*e;lean=-7*e;fg={x:19+8*e,y:-10};rg={x:15+8*e,y:-8};kneeP={x:lerp(-4,28,e),y:lerp(25,-8,e)}}
  else if(mv==='hit'){lean=-13*(1-p);fx=-7*(1-p);hop=0}
  else if(mv==='win'){fg={x:7,y:-40};rg={x:-5,y:-40};hop=Math.abs(Math.sin(S.t*7))*6;lean=0}
  return{lean,fx,hop,ff,rf,fg,rg,el,kneeP}
}
function drawFighter(f,isChamp){
  const P=fighterPose(f),sc=.95;
  ctx.save();ctx.translate(f.x,448);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,1,26,6,0,0,7);ctx.fill();
  if(f.pose==='ko'){const k=clamp(f.pt/.7,0,1);ctx.rotate(-f.facing*easeOut(k)*Math.PI/2*.92)}
  ctx.scale(f.facing*sc,sc);

    WS=ws;ws.onmessage=e=>{try{onServerMsg(JSON.parse(e.data))}catch(_){}};ws.onclose=()=>setTimeout(connect,2000)};
  connect();
  // ปุ่มทดสอบ (ก่อนขึ้นไลฟ์): F เข้ามา, 1-4 ของขวัญจากคนสุ่ม, 5 แชมป์ส่งเตะ, 6 ผู้ท้าชิงส่งศอก, R/B เชียร์แดง/น้ำเงิน, L หัวใจ
  window.addEventListener('pointerdown',unlockAudio);
  window.addEventListener('keydown',e=>{unlockAudio();const w=fakeW('ทดสอบ'+Math.floor(Math.random()*9+1)),k=e.key.toLowerCase(),F=S.F;
    if(k==='f')evJoin(w);else if(k==='1')evGift(w,1);else if(k==='2')evGift(w,5);else if(k==='3')evGift(w,20);else if(k==='4')evGift(w,100);
    else if(k==='5'&&F.red)evGift(F.red.w,5);else if(k==='6'&&F.blue)evGift(F.blue.w,20);
    else if(k==='r')evComment(w,'แดง');else if(k==='b')evComment(w,'น้ำเงิน');else if(k==='l')evLike(5)});
}else{for(let i=0;i<6;i++)evJoin(fakeW(NAMES[i]))}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
