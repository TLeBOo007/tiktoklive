<script>
const LIVE=new URLSearchParams(location.search).get('live')==='1';
if(LIVE)document.body.classList.add('live');
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=640;let K=1;
function resize(){
  const DPR=Math.min(3,window.devicePixelRatio||1);let cw,ch;
  if(LIVE){ch=window.innerHeight;cw=ch*W/H;if(cw>window.innerWidth){cw=window.innerWidth;ch=cw*H/W}}
  else{cw=Math.min(420,cv.parentElement.clientWidth);ch=cw*H/W}
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);K=cv.width/W;
}
window.addEventListener('resize',resize);resize();
if(document.fonts)['700 20px Kanit','500 20px Kanit','400 14px Sarabun','700 14px Sarabun'].forEach(f=>document.fonts.load(f).catch(()=>{}));

/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{const c=1.7;t=clamp(t,0,1);return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const TH="'Noto Sans Thai',Tahoma,sans-serif";
const F=(w,s,fam)=>w+' '+s+'px '+(fam||'Sarabun')+','+TH;
const CJK=s=>'700 '+s+'px "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",serif';
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function poly(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}}
function txt(s,x,y,font,col,align,stroke){ctx.font=font;ctx.textAlign=align||'left';if(stroke){ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function fit(s,maxW,font){ctx.font=font;s=String(s);if(ctx.measureText(s).width<=maxW)return s;let t=s;while(t.length>1&&ctx.measureText(t+'…').width>maxW)t=t.slice(0,-1);return t+'…'}
const SEG=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter('th',{granularity:'word'}):null;
function wrapTh(text,maxW,font){
  ctx.font=font;const parts=SEG?[...SEG.segment(text)].map(s=>s.segment):[...text];const out=[];let line='';
  for(const w of parts){if(line&&ctx.measureText(line+w).width>maxW){out.push(line.trim());line=w.trimStart()}else line+=w}
  if(line.trim())out.push(line.trim());return out;
}
function radial(x,y,r0,r1,c0,c1){const g=ctx.createRadialGradient(x,y,r0,x,y,r1);g.addColorStop(0,c0);g.addColorStop(1,c1);return g}
function glowAt(x,y,r,rgb,a){ctx.fillStyle=radial(x,y,0,r,'rgba('+rgb+','+a+')','rgba('+rgb+',0)');ctx.fillRect(x-r,y-r,r*2,r*2)}

/* ---------- data ---------- */
const NAMES=['น้องมายด์','พี่เอ็ม','ป้าแดง','Tawannn','ไอ้ย้อย','Khakty','ลุงหมี','แพรว','nutnicha','โอ๊ต','ส้มโอ','mon_cm','เจ๊น้อย','ต้นกล้า','ฟ้าใส','อาปุ๊','ครูแอน','เอิร์ธ','มะปราง','พี่บอม','ป้าหน่อย','นุ่น','โต้ง','ปอนด์'];
const ROBES=['#c8102e','#d6457a','#1f8a5b','#2a5fb8','#c9661f','#7c3fb8','#13928f','#b8861b','#8e1b3c'];
const SKINS=['#f6d3b0','#ebbd94','#d9a273','#f3c9a3'];
const HAIRS=['#161616','#3a2418','#5a3a22','#1d2340'];
const FORT=['งานที่ค้างอยู่จะมีคนยื่นมือมาช่วย อย่ารีบตัดสินใจเรื่องเงิน','ความรักค่อยๆ ดีขึ้น ลองเปิดใจคุยกันตรงๆ','เดินทางราบรื่น แต่ระวังของหายเล็กน้อย','โชคเล็กๆ มาจากคนใกล้ตัว อย่าลืมขอบคุณ','เหนื่อยมามากแล้ว ได้พักก่อนเริ่มรอบใหม่','มีเรื่องใหม่ให้เริ่ม ลงมือเลยดีกว่าคิดนาน','การเงินทรงตัว เก็บออมเพิ่มอีกนิดจะอุ่นใจ','คำพูดดีๆ ที่ให้คนอื่น จะย้อนกลับมาหาตัวเอง','ผู้ใหญ่เมตตา งานที่ยื่นไว้มีข่าวดี','สุขภาพต้องใส่ใจ นอนให้พอแล้วทุกอย่างจะดีขึ้น','เพื่อนเก่าจะติดต่อมา นำโอกาสดีมาให้','ความพยายามช่วงนี้ เริ่มเห็นผลแล้ว'];
const LEVELS=[{t:'ดีเลิศ',c:'#c8102e'},{t:'ดีมาก',c:'#b8860b'},{t:'ดีมาก',c:'#b8860b'},{t:'ดี',c:'#2e7d32'},{t:'ดี',c:'#2e7d32'},{t:'ปานกลาง',c:'#6d4c41'}];
const DAYS={'อาทิตย์':'แดง','จันทร์':'เหลือง','อังคาร':'ชมพู','พุธ':'เขียว','พฤหัส':'ส้ม','ศุกร์':'ฟ้า','เสาร์':'ม่วง'};
const GIFTS={incense:{e:'🌹',n:'จุดธูป',c:1},stick:{e:'🎋',n:'เซียมซี',c:5},lantern:{e:'🏮',n:'ลอยโคม',c:20},bless:{e:'✨',n:'เสริมดวง',c:100}};
const SLOTS=[];
[[492,[36,92,268,324]],[528,[60,120,180,240,300]],[564,[30,90,150,210,270,330]],[600,[60,120,180,240,300]]]
 .forEach(([y,xs])=>xs.forEach(x=>SLOTS.push({x,y,s:.86+(y-492)/108*.24})));

const S={faithTotal:0,faithLevel:0,faithContrib:{},dragonQ:[],dragon:null,lastSay:{},host:null,hostAnn:null,boss:null,bossMsg:null,slayer:null,bossT:0,t:0,avs:[],feed:[],toasts:[],parts:[],score:{},names:{},pics:{},slipQ:[],slip:null,bannerQ:[],banner:null,
  autoT:1.5,shake:0,flash:0,glow:0,burner:3,bgLan:[],motesT:0,petalT:0};
for(let i=0;i<7;i++)S.bgLan.push({x:rnd(10,350),y:rnd(240,430),s:rnd(.35,.6),v:rnd(5,10),ph:rnd(0,6)});

/* ---------- profile pictures ---------- */
const IMG={};
function getImg(url){
  if(!url)return null;let o=IMG[url];
  if(!o){o=IMG[url]={img:new Image(),ok:false};o.img.referrerPolicy='no-referrer';o.img.onload=()=>o.ok=true;o.img.src=url}
  return o.ok?o.img:null;
}
function drawHead(w,x,y,r,ring){
  const img=getImg(w.pic);
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();
  if(img){ctx.drawImage(img,x-r,y-r,r*2,r*2)}
  else{
    ctx.fillStyle=w.skin||'#f3c9a3';ctx.fillRect(x-r,y-r,r*2,r*2);
    ctx.fillStyle=w.hair||'#161616';ctx.beginPath();ctx.ellipse(x,y-r*.45,r*1.1,r*.75,0,0,7);ctx.fill();
    ctx.fillStyle='#2a1a14';ctx.beginPath();ctx.arc(x-r*.36,y+r*.12,r*.12,0,7);ctx.arc(x+r*.36,y+r*.12,r*.12,0,7);ctx.fill();
    ctx.fillStyle='rgba(240,110,110,.35)';ctx.beginPath();ctx.arc(x-r*.55,y+r*.4,r*.18,0,7);ctx.arc(x+r*.55,y+r*.4,r*.18,0,7);ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle=ring||'rgba(255,255,255,.85)';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
}

/* ---------- game logic ---------- */
function add(w,v){S.score[w.id]=(S.score[w.id]||0)+v;S.names[w.id]=w.name;if(w.pic)S.pics[w.id]=w.pic}
function topIds(){return Object.entries(S.score).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0])}
function addFeed(text){S.feed.push({text,t:0});if(S.feed.length>3)S.feed.shift()}
function toast(a,kind){S.toasts.push({a,g:GIFTS[kind],t:0});if(S.toasts.length>3)S.toasts.shift()}
function burst(x,y,n,col,sp){for(let i=0;i<n;i++)S.parts.push({k:'spark',x,y,vx:rnd(-1,1)*(sp||70),vy:rnd(-110,-10),life:0,max:rnd(.6,1.1),col})}
const HOST_POS={x:118,y:408,s:1.3};
function posOf(a){return a.isHost?HOST_POS:SLOTS[a.slot]}
function headPos(a){const p=posOf(a);return{x:p.x,y:p.y-34*p.s}}

function realCount(){return S.avs.filter(v=>!v.npc).length}
function addNpc(){
  const used=new Set(S.avs.map(v=>v.slot));const free=SLOTS.map((_,i)=>i).filter(i=>!used.has(i));if(!free.length)return;
  const slot=pick(free);S.avs.push({id:'npc_'+Math.random(),name:'',npc:true,pic:'',slot,robe:pick(['#7a5a3a','#5a4a6a','#4a6a5a','#8a6a4a']),skin:pick(SKINS),hair:pick(HAIRS),spawn:0,bow:0,inc:rnd(0,20),aura:0,say:'',sayT:0,hop:0,nextBow:rnd(2,6)});
}
function freeSlot(){
  const used=new Set(S.avs.map(v=>v.slot));
  let slot=SLOTS.findIndex((_,i)=>!used.has(i));
  if(slot<0){const ni=S.avs.findIndex(v=>v.npc);if(ni>=0){slot=S.avs[ni].slot;S.avs.splice(ni,1)}}
  if(slot<0){const keep=new Set(topIds());let idx=S.avs.findIndex(v=>!keep.has(v.id)&&!v.npc&&!v.isHost);
    if(idx<0)idx=S.avs.findIndex(v=>!v.isHost);slot=S.avs[idx].slot;S.avs.splice(idx,1)}
  return slot;
}
function ensure(w){
  let a=S.avs.find(v=>v.id===w.id);
  if(a){a.name=w.name||a.name;if(w.pic)a.pic=w.pic;return a}
  const slot=freeSlot();
  a={id:w.id,name:w.name,pic:w.pic||'',slot,robe:pick(ROBES),skin:pick(SKINS),hair:pick(HAIRS),spawn:0,bow:0,inc:0,aura:0,say:'',sayT:0,hop:0};
  S.avs.push(a);
  const h=headPos(a);burst(h.x,h.y,16,'#ffd36b');
  return a;
}
/* ===== อ่านออกเสียง (Text-to-Speech) ===== */
const QS=new URLSearchParams(location.search);
const TTS={on:LIVE?QS.get('tts')!=='0':false,q:[],busy:false,voice:null,hasTh:false,unlocked:!LIVE};
function pickVoice(){
  if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>/^th/i.test(v.lang));
  TTS.hasTh=vs.length>0;TTS.voice=vs.find(v=>/natural|online|premwadee|niwat/i.test(v.name))||vs[0]||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function spk(n){n=String(n||'').replace(/[^\u0E00-\u0E7Fa-zA-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim().slice(0,20);return n?(/^คุณ/.test(n)?n:'คุณ'+n):'คุณผู้ชม'}
function say(text,prio){
  if(!TTS.on||!('speechSynthesis' in window)||!TTS.hasTh)return;
  if(TTS.q.length>=4){if(prio<2)return;TTS.q=TTS.q.filter(x=>x.p>=2).slice(-3)}
  TTS.q.push({text,p:prio||0});pumpSay();
}
function pumpSay(){
  if(TTS.busy||!TTS.q.length||!TTS.unlocked)return;
  let bi=0;TTS.q.forEach((x,i)=>{if(x.p>TTS.q[bi].p)bi=i});const it=TTS.q.splice(bi,1)[0];
  const u=new SpeechSynthesisUtterance(it.text);u.lang='th-TH';if(TTS.voice)u.voice=TTS.voice;u.rate=1.05;
  TTS.busy=true;duck(true);const done=()=>{if(!TTS.busy)return;TTS.busy=false;if(!TTS.q.length)duck(false);setTimeout(pumpSay,250)};u.onend=done;u.onerror=done;
  try{speechSynthesis.speak(u)}catch(_){done()}
  setTimeout(()=>{if(TTS.busy&&!speechSynthesis.speaking)done()},20000);
}
function unlockTTS(){startAudio();if(AUD.c&&AUD.c.state==='suspended')AUD.c.resume();if(TTS.unlocked)return;TTS.unlocked=true;pickVoice();say('เปิดเสียงแล้ว',3)}
/* ===== เพลงประกอบ + เสียงเอฟเฟกต์ (สร้างสดด้วย Web Audio ไม่ใช้ไฟล์เพลง ไม่มีลิขสิทธิ์) ===== */
const AUD={music:LIVE?QS.get('music')!=='0':false,sfx:LIVE?QS.get('sfx')!=='0':false,c:null,mg:null,sg:null,last:{},nextNote:0,phrase:0,idx:5,beat:.9,started:false,ducked:false};
const PENTA=[0,2,4,7,9];
function noteFreq(i){const oct=Math.floor(i/5),deg=((i%5)+5)%5;return 146.83*Math.pow(2,oct+PENTA[deg]/12)}
function musicLevel(){return AUD.music?(AUD.ducked?.14:.55):0}
function startAudio(){
  if(AUD.started||(!AUD.music&&!AUD.sfx))return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC()}catch(_){return}
  AUD.c=c;AUD.started=true;if(c.resume)c.resume();
  const master=c.createGain();master.gain.value=.9;const comp=c.createDynamicsCompressor();master.connect(comp);comp.connect(c.destination);
  const len=Math.floor(c.sampleRate*2.8),buf=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
  const rv=c.createConvolver();rv.buffer=buf;const rvg=c.createGain();rvg.gain.value=.32;rv.connect(rvg);rvg.connect(master);
  AUD.mg=c.createGain();AUD.mg.gain.value=musicLevel();AUD.mg.connect(master);AUD.mg.connect(rv);
  AUD.sg=c.createGain();AUD.sg.gain.value=AUD.sfx?.7:0;AUD.sg.connect(master);AUD.sg.connect(rv);
  [[73.42,.035],[110,.022],[146.83,.01]].forEach(([f,g],i)=>{const o=c.createOscillator();o.frequency.value=f;const gn=c.createGain();gn.gain.value=g;
    const l=c.createOscillator();l.frequency.value=.07+i*.03;const lg=c.createGain();lg.gain.value=g*.6;l.connect(lg);lg.connect(gn.gain);l.start();o.connect(gn);gn.connect(AUD.mg);o.start()});
  AUD.nextNote=c.currentTime+.6;setInterval(schedMusic,120);
}
function setAudioLevels(){if(!AUD.c)return;const t=AUD.c.currentTime;AUD.mg.gain.setTargetAtTime(musicLevel(),t,.25);AUD.sg.gain.setTargetAtTime(AUD.sfx?.7:0,t,.1)}
function duck(on){AUD.ducked=on;setAudioLevels()}
function pluck(dest,f,t,vol,dec){
  const c=AUD.c,o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),g2=c.createGain(),fl=c.createBiquadFilter();
  o.type='triangle';o.frequency.setValueAtTime(f*1.018,t);o.frequency.exponentialRampToValueAtTime(f,t+.06);o2.frequency.setValueAtTime(f*2.003,t);
  fl.type='lowpass';fl.frequency.setValueAtTime(Math.min(16000,f*8),t);fl.frequency.exponentialRampToValueAtTime(f*1.6,t+dec*.6);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0005,t+dec);g2.gain.value=.3;
  o2.connect(g2);g2.connect(fl);o.connect(fl);fl.connect(g);g.connect(dest);o.start(t);o2.start(t);o.stop(t+dec+.05);o2.stop(t+dec+.05);
}
function bell(dest,f,t,vol,dec){
  const c=AUD.c;[[1,1],[2.76,.4],[5.4,.2]].forEach(([m,a])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f*m;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*a,t+.005);g.gain.exponentialRampToValueAtTime(.0004,t+dec/Math.pow(m,.3));o.connect(g);g.connect(dest);o.start(t);o.stop(t+dec+.1)});
}
function noiseAt(dest,t,dur,vol,type,f,q){
  const c=AUD.c,len=Math.ceil(c.sampleRate*dur),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;

    txt('รอบหน้าช่วยกันปราบให้ได้!',0,18,F('700',12),'#fff','center')}
  ctx.restore();
}
function draw(){
  ctx.setTransform(K,0,0,K,0,0);ctx.clearRect(0,0,W,H);
  const tops=topIds(),sh=S.shake*7;
  ctx.save();if(sh)ctx.translate(rnd(-sh,sh),rnd(-sh,sh));
  drawSky();drawBgLanterns();drawGround();drawShrine();drawGarland();drawBurner();drawHostSpot();if(S.boss)drawBoss();
  [...S.avs].sort((a,b)=>posOf(a).y-posOf(b).y).forEach(a=>drawAvatar(a,tops));
  drawParts();if(S.dragon)drawDragon();ctx.restore();
  if(S.boss&&(S.boss.state==='enter'||S.boss.state==='fight')){ctx.fillStyle='rgba(60,0,80,'+(.16+.06*Math.sin(S.t*3))+')';ctx.fillRect(0,0,W,H)}
  ctx.fillStyle=radial(180,360,180,460,'rgba(0,0,0,0)','rgba(0,0,0,.55)');ctx.fillRect(0,0,W,H);
  drawUI(tops);drawFaithBar();drawBossBar();drawToasts();drawEmpty();drawHostAnn();drawBanner();drawBossMsg();drawSlip();drawAudioHint();
  if(S.flash>0){ctx.fillStyle='rgba(255,240,200,'+S.flash+')';ctx.fillRect(0,0,W,H)}
}

/* ---------- controls ---------- */
const $=id=>document.getElementById(id);
const who=()=>{const n=$('nm').value.trim()||pick(NAMES);return fakeW(n)};
$('bFollow').onclick=()=>evFollow(who());$('bRose').onclick=()=>evIncense(who());$('bStick').onclick=()=>evStick(who());
$('bLan').onclick=()=>evLantern(who());$('bBless').onclick=()=>evBless(who());$('bLike').onclick=()=>evLike(5);$('bBoss').onclick=()=>{if(!S.boss)spawnBoss()};
$('bDragon').onclick=()=>S.dragonQ.push({names:['น้องมายด์','พี่เอ็ม','ป้าแดง','ลุงหมี'],level:S.faithLevel||1});
$('mus').onchange=e=>{AUD.music=AUD.sfx=e.target.checked;if(!AUD.started)startAudio();else{if(AUD.c.state==='suspended')AUD.c.resume();setAudioLevels()}};
$('tts').onchange=e=>{TTS.on=e.target.checked;TTS.unlocked=true;pickVoice();if(TTS.on&&!TTS.hasTh)alertBox();};
function alertBox(){addFeed('⚠ ไม่พบเสียงภาษาไทยในเบราว์เซอร์นี้')}
$('bCm').onclick=()=>{const t=$('cm').value.trim();if(t){evComment(who(),t);$('cm').value=''}};
$('cm').addEventListener('keydown',e=>{if(e.key==='Enter')$('bCm').click()});

if(LIVE){
  const connect=()=>{
    let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(_){return setTimeout(connect,2000)}
    ws.onmessage=e=>{try{onServerMsg(JSON.parse(e.data))}catch(_){}};
    ws.onclose=()=>setTimeout(connect,2000);
  };
  connect();
  // ปุ่มทดสอบบนคีย์บอร์ด (ใช้ก่อนขึ้นไลฟ์): F ติดตาม, 1-4 ของขวัญ, S สาธุ, L หัวใจ, B เรียกปีศาจ, D มังกร
  window.addEventListener('pointerdown',unlockTTS);
  window.addEventListener('keydown',e=>{unlockTTS();
    const w=fakeW('ทดสอบ'+Math.floor(Math.random()*9+1)),k=e.key.toLowerCase();
    if(k==='f')evFollow(w);else if(k==='1')evIncense(w);else if(k==='2')evStick(w);else if(k==='3')evLantern(w);
    else if(k==='4')evBless(w);else if(k==='s')evComment(w,'สาธุ');else if(k==='l')evLike(5);
    else if(k==='b'&&!S.boss)spawnBoss();
    else if(k==='d')S.dragonQ.push({names:['ทดสอบ1','ทดสอบ2','ทดสอบ3','ทดสอบ4'],level:S.faithLevel||1});
  });
}else{
  for(let i=0;i<7;i++)evFollow(fakeW(NAMES[i]));
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
